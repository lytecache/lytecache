name: Split lytecache-php to standalone repo

# Packagist only supports installing from a repository's root (it references
# source directly by tag rather than hosting built archives -- see
# lytecache-php/RELEASING.md), so lytecache-php/ needs to also exist as its
# own standalone repo with composer.json at the root. This workflow keeps
# that standalone repo in sync automatically on every PHP release tag, using
# git's built-in `git subtree split` (not the splitsh-lite tool some guides
# recommend -- its current major version dropped prebuilt binaries and now
# requires compiling against libgit2, a much heavier and more fragile CI
# dependency for what only needs to run once per release).

on:
  push:
    tags:
      # The bare vX.Y.Z pattern reserved for PHP/Packagist releases -- see the
      # comment on this same pattern in release.yml (Python's workflow uses
      # python-v* specifically so the two can never collide).
      - "v*.*.*"

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for an accurate subtree split
          # actions/checkout otherwise persists the ambient GITHUB_TOKEN as a
          # credential for all of github.com in the local git config, which
          # takes priority over the SPLIT_REPO_TOKEN embedded in the "split"
          # remote's URL below -- causing the push to authenticate as
          # github-actions[bot] (with no access to the split repo) instead of
          # the PAT that actually has write access to it.
          persist-credentials: false

      - name: Split lytecache-php/ out into its own branch
        run: git subtree split --prefix=lytecache-php -b split-branch

      - name: Push the split history and matching tag to the standalone repo
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          git remote add split "https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/lytecache/lytecache-php.git"
          git push split split-branch:refs/heads/main --force
          git push split "split-branch:refs/tags/${TAG_NAME}" --force

  # Proves the artifact users actually download works: waits for Packagist to
  # pick up the tag, installs exactly that version into an empty project on the
  # floor PHP version, and runs a smoke test against it.
  verify-published:
    needs: split
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: Wait for Packagist to list the new version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          for attempt in $(seq 1 40); do
            if curl -fsS "https://repo.packagist.org/p2/lytecache/lytecache.json" | grep -q "\"version\":\"${version}\""; then
              echo "Packagist lists ${version}"; exit 0
            fi
            echo "attempt ${attempt}: ${version} not on Packagist yet"; sleep 15
          done
          echo "::error::Packagist did not list ${version} within 10 minutes"; exit 1

      - name: Install the published version and run the smoke test
        working-directory: ${{ runner.temp }}
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          mkdir app && cd app
          echo '{}' > composer.json
          composer require --no-interaction "lytecache/lytecache:${version}"
          test ! -e vendor/lytecache/lytecache/vendor || { echo "::error::the published package ships a vendor/ directory"; exit 1; }
          cat > smoke.php <<'PHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $cache = new Lytecache\LyteCache(path: sys_get_temp_dir().'/smoke.db');
          $cache->set('greeting', 'hello');
          if ($cache->get('greeting') !== 'hello') { fwrite(STDERR, "smoke failed\n"); exit(1); }
          echo 'published ', Composer\InstalledVersions::getPrettyVersion('lytecache/lytecache'), ' works on PHP ', PHP_VERSION, PHP_EOL;
          PHP
          php smoke.php
